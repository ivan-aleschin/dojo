[project]
name = "dojo"
version = "0.1.0"
description = "Coding Dojo: подготовка к стажировке — алгоритмы, Python, бэкенд"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Ivan" }]

dependencies = [
    "pytest>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",          # линтер + форматтер
    "mypy>=1.20.0",          # статическая типизация
]

[tool.uv]
package = false  # не устанавливается как библиотека
python-preference = "only-system"  # Заставляет uv искать Python в системе

# ─── Pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["algorithms", "python", "coderun", "tests"]
pythonpath = ["."]
addopts = "-ra -q --doctest-modules --import-mode=importlib"
consider_namespace_packages = true
# --import-mode=importlib нужен потому, что все задачи называются solution.py:
# при обычном режиме pytest ругается на одинаковые имена модулей
# --doctest-modules запускает примеры прямо из docstring'ов в solution.py

# ─── Ruff (линтер + форматтер вместо black) ───────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (сортировка импортов встроена в ruff)
    "B",        # flake8-bugbear
    "UP",       # pyupgrade (авто-апгрейд синтаксиса к новой версии Python)
    "N",        # pep8-naming
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
]
ignore = ["E501"]  # длину строк контролирует форматтер

[tool.ruff.format]
# Ruff format — drop-in замена Black, 99.9% совместим
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ─── Mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
# Для алго-задач strict — полезная привычка писать аннотации
