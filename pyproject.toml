[project]
name = "dojo"
version = "0.1.0"
description = "Coding Dojo: алгоритмы, LeetCode, CodeRun, FastAPI"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Ivan" }]

dependencies = [
    "numpy>=2.3.0",          # матрицы, векторные операции
    "pytest>=9.0.0",         # тесты
    "pytest-benchmark>=5.0", # замеры скорости решений
    "rich>=14.0.0",          # красивый вывод в консоль
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",          # линтер + форматтер (заменяет black + flake8 + isort)
    "mypy>=1.20.0",          # статическая типизация
    "pytest-asyncio>=0.25",  # для FastAPI тестов
    "httpx>=0.28",           # тестовый клиент для FastAPI
]

[tool.uv]
package = false  # не устанавливается как библиотека
python-preference = "only-system"  # Заставляет uv искать Python в системе

# ─── Pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["algorithms", "leetcode", "coderun", "fastapi_practice"]
pythonpath = ["."]
addopts = "-ra -q --doctest-modules"
# --doctest-modules запускает примеры прямо из docstring'ов в solution.py
# Если FastAPI-модули мешают, добавь:
# norecursedirs = ["fastapi_practice", "playground", ".venv"]

# ─── Ruff (линтер + форматтер вместо black) ───────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (сортировка импортов встроена в ruff)
    "B",        # flake8-bugbear
    "UP",       # pyupgrade (авто-апгрейд синтаксиса к новой версии Python)
    "N",        # pep8-naming
    "SIM",      # flake8-simplify
    "C4",       # flake8-comprehensions
]
ignore = ["E501"]  # длину строк контролирует форматтер

[tool.ruff.format]
# Ruff format — drop-in замена Black, 99.9% совместим
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ─── Mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
# Для алго-задач strict — полезная привычка писать аннотации
